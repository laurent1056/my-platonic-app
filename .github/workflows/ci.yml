name: Validate Platonic Ideal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Use Python for dossier validation
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dossier validation dependency
        run: python -m pip install --disable-pip-version-check --no-input --quiet Pillow
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Type-check, validate data, build, and verify output
        run: npm test
